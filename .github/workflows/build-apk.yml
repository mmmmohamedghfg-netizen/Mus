name: Build Android APK from ZIP

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find project ZIP file
        id: find_zip
        run: |
          ZIP_FILE=$(find . -maxdepth 2 -type f -iname "*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "لم يتم العثور على ملف ZIP في المستودع."
            exit 1
          fi

          echo "Found ZIP: $ZIP_FILE"
          echo "zip_file=$ZIP_FILE" >> "$GITHUB_OUTPUT"

      - name: Extract project ZIP
        run: |
          mkdir -p extracted
          unzip -q "${{ steps.find_zip.outputs.zip_file }}" -d extracted

          PROJECT_DIR=$(find extracted -type f -name "settings.gradle.kts" -exec dirname {} ; | head -n 1)

          if [ -z "$PROJECT_DIR" ]; then
            echo "لم يتم العثور على مشروع Android داخل ملف ZIP."
            exit 1
          fi

          echo "Project directory: $PROJECT_DIR"
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --stacktrace
        working-directory: ${{ env.project_dir }}

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: MusicPlayerPro-debug-apk
          path: ${{ env.project_dir }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
